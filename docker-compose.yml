services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - --model=Qwen/Qwen3-VL-8B-Instruct
      - --dtype=bfloat16
      - --max-model-len=16384
      - --gpu-memory-utilization=0.85
      - --limit-mm-per-prompt={"image": 4}
      - --enable-prefix-caching
      - --port=8001
    ipc: host
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8001:8001"

  api:
    image: huyvhq1107/vlm:1.0.0
    build: .
    env_file: .env
    environment:
      VLM_MODE: vllm
      VLLM_BASE_URL: http://vllm:8001/v1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - vllm

volumes:
  hf-cache:
